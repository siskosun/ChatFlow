name: Apply bounded final UI review repairs
on:
  pull_request:
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'siskosun/ChatFlow' && github.head_ref == 'cf/answer-headings-20261104' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-locked non-workflow edits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/cf/answer-headings-20261104 | cut -f1)" = "$EXPECTED_HEAD"
          test -f .ci-final-ui.json || exit 0
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          changes=json.loads(Path('.ci-final-ui.json').read_text())
          assert set(changes)=={'workspace/app.js','tests/rollout_e2e.py','tests/source-picker-race.test.mjs','docs/reviews/2026-11-04-final-ui-audit.md'}
          pending=[]
          for name,spec in changes.items():
              p=Path(name);prior=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(prior).hexdigest() if prior is not None else None)==spec['before'],name+' source changed'
              if 'content' in spec:out=spec['content'].encode()
              else:
                  lines=prior.decode().splitlines(True)
                  for start,end,value in reversed(spec['edits']):lines[start:end]=[value]
                  out=''.join(lines).encode()
              assert hashlib.sha256(out).hexdigest()==spec['after'],name+' target mismatch'
              pending.append((p,out))
          for p,out in pending:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(out)
          PY
          git rm .ci-final-ui.json
          git add workspace/app.js tests/rollout_e2e.py tests/source-picker-race.test.mjs docs/reviews/2026-11-04-final-ui-audit.md
          git config user.name 'ChatFlow cloud development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve live source selection and clarify per-file handoff actions'
          git push origin HEAD:refs/heads/cf/answer-headings-20261104
