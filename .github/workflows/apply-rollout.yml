name: apply-rollout-source
on:
  pull_request:
    paths:
      - '.devpayload/**'
      - '.github/workflows/apply-rollout.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'siskosun/ChatFlow' && github.event.pull_request.head.repo.full_name == 'siskosun/ChatFlow' && github.head_ref == 'cf/complete-rollout-20261104'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every source checksum then apply on the feature branch only
        run: python .devpayload/apply.py
